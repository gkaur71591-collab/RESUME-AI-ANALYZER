name: FastAPI CI

permissions:
  contents: read
  packages: write


on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master


jobs:
  test:

    runs-on: ubuntu-latest


    services:

      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5



    steps:


      - name: Checkout Repository
        uses: actions/checkout@v4



      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"



      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt



      - name: Check Database Connection

        env:
          PGPASSWORD: postgres

        run: |
          psql -h localhost -U postgres -d resume_db -c "\dt"



      - name: Run Database Migrations

        env:

          APP_NAME: "AI Resume Analyzer"
          APP_ENV: "testing"

          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/resume_db"

          JWT_SECRET_KEY: "test-secret-key"
          JWT_ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"

          REDIS_URL: "redis://localhost:6379/0"

          OPENAI_MODEL: "gpt-4.1-mini"
          OPENAI_API_KEY: "test"

          GEMINI_API_KEY: "test"

          OLLAMA_HOST: "http://localhost:11434"


        run: |
          alembic upgrade head




      - name: Run Unit Tests

        env:

          APP_NAME: "AI Resume Analyzer"
          APP_ENV: "testing"

          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/resume_db"

          JWT_SECRET_KEY: "test-secret-key"

          JWT_ALGORITHM: "HS256"

          ACCESS_TOKEN_EXPIRE_MINUTES: "30"

          REDIS_URL: "redis://localhost:6379/0"

          OPENAI_MODEL: "gpt-4.1-mini"

          OPENAI_API_KEY: "test"

          GEMINI_API_KEY: "test"

          OLLAMA_HOST: "http://localhost:11434"


        run: |
          pytest -v



      # -------------------------------
      # Docker Build and Push to GHCR
      # -------------------------------


      - name: Login to GitHub Container Registry

        uses: docker/login-action@v3

        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}



      - name: Setup Docker Buildx

        uses: docker/setup-buildx-action@v3



      - name: Build and Push Docker Image

        uses: docker/build-push-action@v6

        with:

          context: .

          file: Dockerfile.prod

          push: true

          tags: |

            ghcr.io/${{ github.repository_owner }}/resume-api:latest

            ghcr.io/${{ github.repository_owner }}/resume-api:${{ github.sha }}