services:

  backend:

    build:
      context: .
      dockerfile: Dockerfile.prod

    container_name: resume-api

    ports:
      - "8000:8000"

    env_file:
      - .env.prod

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:

      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health"
        ]

      interval: 30s
      timeout: 10s
      retries: 3



  worker:

    build:
      context: .
      dockerfile: Dockerfile.prod

    container_name: resume-worker

    command:
      celery -A app.worker.celery.celery_app worker --loglevel=info


    env_file:
      - .env.prod


    extra_hosts:
      - "host.docker.internal:host-gateway"


    depends_on:

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy



  postgres:

    image: postgres:16

    container_name: resume-postgres

    restart: always


    environment:

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      POSTGRES_DB: resume_db


    ports:

      - "5434:5432"


    volumes:

      - postgres_data:/var/lib/postgresql/data


    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres"
        ]

      interval: 10s

      timeout: 5s

      retries: 5



  redis:

    image: redis:7

    container_name: resume-redis

    restart: always


    ports:

      - "6379:6379"


    healthcheck:

      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 10s

      timeout: 5s

      retries: 5



volumes:

  postgres_data: